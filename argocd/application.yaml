---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-demo-app
spec:
  destination:
    namespace: demo
    server: https://kubernetes.default.svc
  source:
    path: helm
    repoURL: https://github.com/thefirstarcher/go-demo-app
    targetRevision: main
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
